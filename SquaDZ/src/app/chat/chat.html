<div class="chat">
  <div class="chat-history">
    @for (message of messages(); track message.id) {
      <div class="message" [class]="'message--' + message.author + ' message--' + message.status">
        @if (message.status === 'waiting') {
          <span class="message__loading">L'assistant réfléchit…</span>
        } @else {
          <span class="message__text">{{ message.text }}</span>
        }
      </div>
    } @empty {
      <p class="chat-empty">Pose ta première question sur les cours EPF.</p>
    }
  </div>

  <form class="chat-form" (ngSubmit)="submit()">
    <input
      class="chat-input"
      type="text"
      name="question"
      placeholder="Écris ta question…"
      autocomplete="off"
      [ngModel]="questionDraft()"
      (ngModelChange)="questionDraft.set($event)"
      [disabled]="loading()"
    />
    <button class="chat-submit" type="submit" [disabled]="loading() || !questionDraft().trim()">
      Envoyer
    </button>
  </form>
</div>
